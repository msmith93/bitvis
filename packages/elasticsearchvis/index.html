<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elasticsearch Write-Path Visualizer</title>
    <meta
      name="description"
      content="Visualizing a 3-shard (1-replica) index on a 3-node Elasticsearch cluster — index, refresh, flush, merge and search, one step at a time."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://elasticsearchvis.bitsculpt.top/" />
    <meta property="og:title" content="Elasticsearch Write-Path Visualizer" />
    <meta
      property="og:description"
      content="Visualizing a 3-shard (1-replica) index on a 3-node Elasticsearch cluster — index, refresh, flush, merge and search, one step at a time."
    />
    <meta property="og:image" content="https://elasticsearchvis.bitsculpt.top/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A scatter-gather search fanning out across the shards of a simulated Elasticsearch cluster" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elasticsearch Write-Path Visualizer" />
    <meta
      name="twitter:description"
      content="Visualizing a 3-shard (1-replica) index on a 3-node Elasticsearch cluster — index, refresh, flush, merge and search, one step at a time."
    />
    <meta name="twitter:image" content="https://elasticsearchvis.bitsculpt.top/og-image.png" />
    <script>
      // Apply the saved theme before first paint so a light-mode reader never
      // sees a dark flash. The toggle lives in the header; see ThemeToggle.jsx.
      try {
        var t = localStorage.getItem('esvis-theme')
        if (t === 'light' || t === 'dark')
          document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
